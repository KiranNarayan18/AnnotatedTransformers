[project]
name = "annotated-transformers"
version = "0.1.0"
description = "An educational, from-scratch PyTorch implementation of the Transformer architecture"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["torch", "torchvision", "datasets", "spacy"]

[project.optional-dependencies]
visualization = ["altair", "pandas", "ipykernel"]
dev = ["pytest", "ruff"]

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
